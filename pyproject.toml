[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "btoon"
version = "0.1.2"
description = "BTOON: compact binary serialization — MessagePack plus columnar tables, timestamps, big ints and vectors"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "BTOON Contributors", email = "hello@btoon.net" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["serialization", "binary", "messagepack", "msgpack", "tabular", "columnar", "compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "msgpack>=1.0"]

[project.urls]
Homepage = "https://btoon.net"
Repository = "https://github.com/BTOON-project/btoon-python"
Specification = "https://github.com/BTOON-project/btoon-core/blob/main/docs/SPEC.md"
Issues = "https://github.com/BTOON-project/btoon-python/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["btoon"]
# The sdist must be buildable on its own, so it carries the core sources.
sdist.include = [
    "core/CMakeLists.txt", "core/LICENSE", "core/include/btoon/*.h", "core/src/*.cpp", "core/src/*.h",
]
sdist.exclude = [".github", "build", "tests/__pycache__", "core/.git", "core/tests", "core/tools", "core/docs"]

[tool.scikit-build.cmake.define]
BTOON_CORE_DIR = { env = "BTOON_CORE_DIR", default = "" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: test the installed package, never the source tree's btoon/ (no _btoon there).
addopts = "-ra --import-mode=importlib"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *-win32 *-manylinux_i686"
test-requires = ["pytest>=8", "msgpack>=1.0"]
test-command = "pytest {project}/tests -q"
build-verbosity = 1

[tool.cibuildwheel.linux]
before-all = "yum install -y zlib-devel || (apt-get update && apt-get install -y zlib1g-dev) || apk add zlib-dev"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
