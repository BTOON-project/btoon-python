name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14t: free-threaded CPython (the extension declares it doesn't need the GIL)
        python: ["3.10", "3.12", "3.14", "3.14t", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -v ".[test]" numpy
      - name: Test
        # the pytest entry point (not `python -m pytest`) so the source tree's btoon/ can't shadow the install
        run: pytest -q
        env:
          # Free-threaded: keep the GIL off for the whole run, so the thread tests run in
          # parallel even if a test dependency re-enabled it. tests/test_threads.py checks,
          # without this, that importing btoon leaves the GIL off.
          PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '' }}

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Build and test from the sdist alone
        # Outside the checkout, so the tests can only use what the sdist ships: the core
        # sources and the conformance vectors.
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          python -m pip install ".[test]"
          pytest -q
